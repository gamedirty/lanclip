name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (M 系列)
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
          # macOS Intel
          - platform: macos-latest
            rust-target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
          # Linux (deb / rpm / AppImage)
          - platform: ubuntu-22.04
            rust-target: ''
            args: ''
          # Windows (NSIS / MSI)
          - platform: windows-latest
            rust-target: ''
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'LanClip v__VERSION__'
          releaseBody: |
            各平台安装包见下方 **Assets**：

            - **Windows**: `*_x64-setup.exe`（NSIS 安装包）或 `*.msi`
            - **macOS**: `*_aarch64.dmg`（Apple Silicon / M 系列）、`*_x86_64.dmg`（Intel）
            - **Linux**: `*.deb`、`*.rpm`、`*.AppImage`

            > macOS 包未做开发者签名，首次打开请右键 → 打开，或在「系统设置 → 隐私与安全性」中允许。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
